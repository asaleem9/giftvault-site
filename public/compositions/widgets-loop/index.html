<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0f2a22; --surface: #163730; --surface-elevated: #1d453c; --brass: #d8c08a; --brass-ink: #2a2410;
        --linen: #f1efe6; --mist: #9db5a9; --hairline: #24463c; --fern: #6fa98b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, sans-serif; color: var(--linen); overflow: hidden; }
      #ground { position: absolute; inset: 0; background: radial-gradient(900px 600px at 50% 60%, rgba(29,69,60,0.85), rgba(15,42,34,0) 70%), var(--ground); }
      .w { position: absolute; border-radius: 28px; background: var(--surface); border: 1px solid var(--hairline); box-shadow: 0 30px 70px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08); overflow: hidden; }
      .w .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.16em; color: var(--mist); }
      .w .name { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
      .w .bal { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      /* small */
      #small { left: 120px; top: 150px; width: 300px; height: 300px; padding: 26px; display: flex; flex-direction: column; justify-content: space-between;
        background: linear-gradient(135deg, #1E8A5A, #0B4A2E); border-color: rgba(255,255,255,0.12); }
      #small .tap { font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: rgba(255,255,255,0.8); }
      #small .name { color: #fff; }
      #small .bal { color: #fff; }
      /* medium */
      #medium { left: 460px; top: 150px; width: 640px; height: 300px; padding: 26px 28px; }
      #medium .row { display: flex; align-items: center; justify-content: space-between; height: 64px; margin-top: 10px; padding: 0 18px; border-radius: 16px; color: #fff; font-weight: 600; font-size: 22px; }
      #medium .row .bal { font-size: 26px; }
      #medium .total { display: flex; justify-content: space-between; align-items: baseline; }
      /* rectangular (Lock Screen) */
      #rect { left: 120px; top: 480px; width: 980px; height: 92px; border-radius: 22px; display: flex; align-items: center; gap: 18px; padding: 0 26px; background: var(--surface-elevated); }
      #rect .dot { width: 14px; height: 14px; border-radius: 7px; background: #ff9f0a; box-shadow: 0 0 0 6px rgba(255,159,10,0.15); }
      #rect .line { font-size: 26px; font-weight: 500; }
      #rect .line b { font-weight: 700; color: var(--brass); }
      /* notification */
      #notif { position: absolute; left: 240px; top: 40px; width: 800px; height: 96px; border-radius: 26px; background: rgba(241,239,230,0.96); color: #1f2a24; display: flex; align-items: center; gap: 18px; padding: 0 22px; box-shadow: 0 30px 60px rgba(0,0,0,0.4); }
      #notif .icon { width: 56px; height: 56px; border-radius: 14px; background: var(--ground); position: relative; flex: none; }
      #notif .icon::after { content: ""; position: absolute; left: 12px; top: 18px; width: 32px; height: 20px; border-radius: 5px; background: var(--brass); transform: rotate(-12deg); }
      #notif .t { font-size: 20px; font-weight: 700; }
      #notif .b { font-size: 19px; color: #3a4a42; margin-top: 2px; }
      #notif .when { margin-left: auto; font-size: 16px; color: #3a4a42; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1280" data-height="720" data-layout-allow-overlap>
      <div id="ground"></div>

      <div id="small" class="w clip" data-start="0" data-duration="7" data-track-index="1">
        <div class="eyebrow" style="color:#fff" data-layout-ignore>STARBUCKS</div>
        <div>
          <div class="bal" id="small-bal">$42.10</div>
          <div class="tap" data-layout-ignore>TAP TO SHOW</div>
        </div>
      </div>

      <div id="medium" class="w clip" data-start="0" data-duration="7" data-track-index="2">
        <div class="total"><span class="eyebrow" data-layout-ignore>TOTAL ACROSS 5 CARDS</span><span class="bal" id="medium-total">$387.40</span></div>
        <div class="row" style="background:linear-gradient(90deg,#1E8A5A,#0B4A2E)"><span>Starbucks</span><span class="bal">$42.10</span></div>
        <div class="row" style="background:linear-gradient(90deg,#E0343A,#8F1419)"><span>Target</span><span class="bal">$25.00</span></div>
        <div class="row" style="background:linear-gradient(90deg,#FFB547,#E27B00);color:#1a1200"><span>Amazon</span><span class="bal">$145.30</span></div>
      </div>

      <div id="rect" class="w clip" data-start="0" data-duration="7" data-track-index="3">
        <div class="dot"></div>
        <div class="line">Target expires in <b>7 days</b> · $25.00 still on it</div>
      </div>

      <div id="notif-slot" class="clip" data-start="0" data-duration="7" data-track-index="4" style="position:absolute;inset:0;pointer-events:none;">
        <div id="notif">
          <div class="icon"></div>
          <div>
            <div class="t">Target card expires in 7 days</div>
            <div class="b">You still have $25.00 on it.</div>
          </div>
          <div class="when">now</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const spring = "elastic.out(1, 0.78)";
      // Widgets slide-settle in, overlapping 40%.
      tl.fromTo("#small", { y: 90, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 1.1, ease: spring }, 0.2);
      tl.fromTo("#medium", { y: 90, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 1.1, ease: spring }, 0.55);
      tl.fromTo("#rect", { y: 70, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 1.0, ease: spring }, 0.9);
      // Balances count up to their real values (deterministic snap to cents).
      const money = (v) => "$" + v.toFixed(2);
      const sb = { v: 0 }, mt = { v: 0 };
      tl.to(sb, { v: 42.1, duration: 1.1, ease: "power3.out", onUpdate: () => { document.getElementById("small-bal").textContent = money(sb.v); } }, 0.5);
      tl.to(mt, { v: 387.4, duration: 1.3, ease: "power3.out", onUpdate: () => { document.getElementById("medium-total").textContent = money(mt.v); } }, 0.85);
      // The reminder drops in on a spring, holds, then lifts away.
      tl.fromTo("#notif", { y: -160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "elastic.out(1, 0.72)" }, 2.6);
      tl.to("#notif", { y: -160, opacity: 0, duration: 0.45, ease: "power3.in" }, 5.3);
      // Loop seam: widgets ease back out just before the end so the last frame matches the first.
      tl.to("#rect", { y: 70, opacity: 0, scale: 0.96, duration: 0.45, ease: "power3.in" }, 6.2);
      tl.to("#medium", { y: 90, opacity: 0, scale: 0.94, duration: 0.45, ease: "power3.in" }, 6.3);
      tl.to("#small", { y: 90, opacity: 0, scale: 0.94, duration: 0.45, ease: "power3.in" }, 6.4);
      tl.to(sb, { v: 0, duration: 0.01 }, 6.95);
      tl.to(mt, { v: 0, duration: 0.01 }, 6.95);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
