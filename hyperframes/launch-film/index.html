<!doctype html>
<html lang="en" data-composition-variables='[{"id":"cta","type":"string","label":"Call to action","default":"Download on the App Store"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0f2a22; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Inter, sans-serif; }
      #ground { position: absolute; inset: 0; background: radial-gradient(1300px 900px at 60% 50%, #1d453c 0%, rgba(22,55,48,0.7) 35%, rgba(15,42,34,0) 72%), #0f2a22; }
      #flood { position: absolute; inset: 0; background: #f1efe6; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="flood" class="clip" data-start="30" data-duration="7" data-track-index="0"></div>

      <audio id="sfx-tag" class="clip" src="assets/sfx/pop.mp3" data-start="2.22" data-duration="0.72" data-volume="0.35" data-track-index="5"></audio>
      <audio id="sfx-gather" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.55" data-duration="0.57" data-volume="0.35" data-track-index="5"></audio>
      <audio id="sfx-flip" class="clip" src="assets/sfx/impact.mp3" data-start="33.43" data-duration="2.1" data-volume="0.35" data-track-index="5"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/pop.mp3" data-start="42.83" data-duration="0.72" data-volume="0.3" data-track-index="5"></audio>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="8" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="proof-add" data-composition-id="proof-add" data-composition-src="compositions/proof-add.html" data-start="13" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="proof-spend" data-composition-id="proof-spend" data-composition-src="compositions/proof-spend.html" data-start="21" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="payoff" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="30" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="claim" data-composition-id="claim" data-composition-src="compositions/claim.html" data-start="37" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="41.5" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // The register flip floods the frame to linen at 33.4 s, then the claim brings the green back.
      tl.fromTo("#flood", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 33.4);
      tl.to("#flood", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 36.45);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
