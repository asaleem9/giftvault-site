        const col = i % 5, row = Math.floor(i / 5);
        return { el, i, sx: 40 + col * 350 + rand() * 140 - 70 + (row % 2) * 110, sy: 20 + row * 260 + rand() * 140 - 70, sr: (rand() - 0.5) * 70 };

    }
    function words(sel) { const el = document.querySelector(sel); el.innerHTML = el.textContent.trim().split(/\s+/).map((w) => `<span class="w">${w}</span>`).join(""); return el.querySelectorAll(".w"); }
