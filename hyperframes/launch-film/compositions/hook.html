<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Inter, sans-serif; }
    #hook-stage { position: absolute; inset: 0; transform-origin: 1140px 480px; }
    .card { position: absolute; left: 0; top: 0; width: 384px; height: 180px; border-radius: 24px; background: linear-gradient(135deg, var(--start), var(--end)); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.18); transform-origin: 50% 50%; }
    .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(260px 160px at 22% 18%, rgba(255,255,255,0.28), rgba(255,255,255,0) 70%); }
    .card .name { position: absolute; left: 26px; top: 22px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
    .card .bal { position: absolute; right: 26px; top: 18px; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .card .last { position: absolute; left: 26px; bottom: 18px; font-size: 15px; letter-spacing: 0.18em; opacity: 0.85; }
    .card .kind { position: absolute; right: 26px; bottom: 18px; font-size: 11px; letter-spacing: 0.2em; opacity: 0.85; }
    .title { position: absolute; left: 120px; right: 120px; color: #f1efe6; font-size: 84px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
    .title .w { display: inline-block; margin-right: 0.24em; }
    .title .accent { color: #d8c08a; }
    .quiet { position: absolute; left: 120px; color: #9db5a9; font-size: 36px; font-weight: 500; letter-spacing: -0.01em; }
    .quiet .w { display: inline-block; margin-right: 0.28em; }
    #hook-tag { position: absolute; left: 0; top: 0; padding: 10px 18px; border-radius: 999px; background: #ff9f0a; color: #1a1200; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; box-shadow: 0 16px 40px rgba(0,0,0,0.35); white-space: nowrap; }
    #hook-title { top: 800px; }
    #hook-q { top: 920px; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080" data-layout-allow-overlap>
    <div id="hook-cards" class="clip" data-start="0" data-duration="8" data-track-index="1" data-layout-allow-overflow>
      <div id="hook-stage"></div>
    </div>
    <div id="hook-title-slot" class="clip" data-start="0.4" data-duration="7.6" data-track-index="2">
      <h1 id="hook-title" class="title">Fourteen gift cards in a drawer.</h1>
      <p id="hook-q" class="quiet">Which one still has money on it?</p>
    </div>
  </div>
  <script>
    function mulberry32(a){return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
    const DECK = [
      ["Walmart","$60.00","#2E6FE0","#0E3C94","#fff","7712"],["Sephora","$50.00","#2b2b2b","#0a0a0a","#fff","3456"],["Costco","$200.00","#E31837","#8C0F22","#fff","9090"],
      ["Best Buy","$35.00","#FFE000","#C7A800","#1a1200","1138"],["Apple","$100.00","#4b4b4b","#111","#fff","2211"],["Nike","$80.00","#1e1e1e","#000","#fff","6060"],
      ["Spotify","$30.00","#1ED760","#0E7A36","#0b1a12","4040"],["Chipotle","$25.00","#A81612","#5E0B09","#fff","1313"],["Ulta","$45.00","#F26E8A","#B5304E","#fff","7777"],
      ["Starbucks","$42.10","#1E8A5A","#0B4A2E","#fff","4471"],["Target","$25.00","#E0343A","#8F1419","#fff","0123"],["DoorDash","$100.00","#FF5A3C","#C62A14","#fff","8810"],
      ["Amazon","$145.30","#FFB547","#E27B00","#1a1200","2209"],["The Home Depot","$75.00","#F7A13B","#D9680A","#fff","5531"]];
    function buildDeck(host, prefix, rand) {
      return DECK.map((c, i) => {
        const el = document.createElement("div"); el.className = "card"; el.id = prefix + i; el.setAttribute("data-layout-ignore", "");
        el.style.setProperty("--start", c[2]); el.style.setProperty("--end", c[3]); el.style.setProperty("--ink", c[4]);
        el.innerHTML = `<div class="name">${c[0]}</div><div class="bal">${c[1]}</div><div class="last">•••• ${c[5]}</div><div class="kind">GIFT CARD</div>`;
        host.appendChild(el);
        const col = i % 5, row = Math.floor(i / 5);
        return { el, i, sx: 40 + col * 350 + rand() * 140 - 70 + (row % 2) * 110, sy: 20 + row * 260 + rand() * 140 - 70, sr: (rand() - 0.5) * 70 };
      });
    }
    function words(sel) { const el = document.querySelector(sel); el.innerHTML = el.textContent.trim().split(/\s+/).map((w) => `<span class="w">${w}</span>`).join(""); return el.querySelectorAll(".w"); }
    function landTitle(tl, sel, at, accentIndex) { const ws = words(sel); if (accentIndex >= 0) ws[accentIndex].classList.add("accent"); tl.fromTo(ws, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, at); return ws; }
    function leaveTitle(tl, ws, at) { tl.to(ws, { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.04, ease: "power2.in" }, at); }
    const tl = gsap.timeline({ paused: true });
    const rand = mulberry32(20261024);
    const stage = document.getElementById("hook-stage");
    const deck = buildDeck(stage, "hook-card-", rand);
    deck.forEach((d) => gsap.set(d.el, { x: d.sx, y: d.sy, rotation: d.sr }));
    // The Target card carries the tag.
    const target = deck[10];
    const tag = document.createElement("div"); tag.id = "hook-tag"; tag.textContent = "Expires in 7 days"; tag.setAttribute("data-layout-ignore", "");
    stage.appendChild(tag);
    gsap.set(tag, { x: target.sx + 30, y: target.sy - 34, rotation: target.sr * 0.3, scale: 0, transformOrigin: "50% 100%" });
    const t1 = landTitle(tl, "#hook-title", 0.6, -1);
    tl.fromTo(tag, { scale: 0 }, { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.8)" }, 2.2);
    // Tension: push in on the tagged card while the rest drift apart.
    tl.fromTo("#hook-stage", { scale: 1, x: 0, y: 0 }, { scale: 1.15, x: (960 - target.sx - 192) * 0.15, y: (540 - target.sy - 90) * 0.15, duration: 1.2, ease: "power2.inOut" }, 3.5);
    deck.forEach((d, i) => { if (i !== 10) tl.to(d.el, { x: d.sx + (d.sx - target.sx) * 0.08, y: d.sy + (d.sy - target.sy) * 0.08, duration: 1.2, ease: "power2.inOut" }, 3.5); });
    leaveTitle(tl, t1, 3.6);
    const q = words("#hook-q");
    tl.fromTo(q, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, 4.2);
    tl.to(q, { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.03, ease: "power2.in" }, 7.4);
    tl.to("#hook-stage", { scale: 1, x: 0, y: 0, duration: 0.5, ease: "power2.inOut" }, 7.5);
    window.__timelines["hook"] = tl;
  </script>
</template>
